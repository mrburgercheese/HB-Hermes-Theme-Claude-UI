# ==============================================================================
# Claude Light Theme for Hermes Agent (Desktop / TUI / CLI)
# Inspired by Anthropic Claude UI — Warm Parchment & Terracotta
# Repository: https://github.com/mrburgercheese/HB-Hermes-Theme-Claude-UI
# ==============================================================================

name: claude-light
description: Anthropic Claude inspired light theme — warm parchment & terracotta accent

colors:
  # Base Canvas & Surface
  background: "#e6dfd3"          # Muted warm parchment canvas (darker, calm on eyes)

  # Brand Accent
  ui_accent: "#c96442"           # Terracotta / warm orange-brown
  banner_accent: "#c96442"

  # Text Hierarchy
  banner_title: "#111111"        # Solid black/charcoal headings
  ui_primary: "#111111"          # Primary text
  banner_text: "#141414"         # Deep crisp black/charcoal body text (high contrast)
  ui_text: "#141414"
  ui_label: "#141414"
  banner_dim: "#4a4642"          # Darker legible secondary text (no washed-out grey)
  banner_border: "#cfc5b4"       # Muted border matching canvas
  ui_border: "#cfc5b4"

  # Semantic Status Colors
  ui_ok: "#2e7d32"               # High-contrast green
  ui_warn: "#b45309"             # High-contrast amber
  ui_error: "#b91c1c"            # High-contrast red

  # CLI / TUI Chrome & Status Bar
  prompt: "#c96442"
  input_rule: "#c96442"
  response_border: "#c96442"
  status_bar_bg: "#dad2c4"
  status_bar_text: "#141414"
  status_bar_good: "#2e7d32"
  status_bar_warn: "#b45309"
  status_bar_critical: "#b91c1c"
  session_label: "#111111"
  session_border: "#cfc5b4"

  # Tool & Reasoning Elements
  ui_tool: "#c96442"
  ui_thinking: "#4a4642"

branding:
  agent_name: Hermes
  prompt_symbol: "❯"

tool_prefix: "┊"
