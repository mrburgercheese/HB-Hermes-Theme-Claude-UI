# ==============================================================================
# Hermes Agent — Recommended Configuration for Claude UI
# Repository: https://github.com/mrburgercheese/HB-Hermes-Theme-Claude-UI
# ==============================================================================
# Petunjuk:
# File ini memuat konfigurasi display & sistem yang dioptimalkan untuk Claude UI.
# Model AI dan provider sengaja tidak disertakan (dapat dikonfigurasi tersendiri
# melalui command `hermes model` atau `hermes setup`).

agent:
  max_turns: 500
  verbose: false
  reasoning_effort: medium
  personalities:
    helpful: You are a helpful, friendly AI assistant.
    concise: You are a concise assistant. Keep responses brief and to the point.
    technical: You are a technical expert. Provide detailed, accurate technical information.
    creative: You are a creative assistant. Think outside the box and offer innovative solutions.
    teacher: You are a patient teacher. Explain concepts clearly with examples.

terminal:
  backend: local
  cwd: .
  timeout: 180
  home_mode: auto
  container_cpu: 1
  container_memory: 5120
  container_disk: 51200
  container_persistent: true
  docker_mount_cwd_to_workspace: false
  lifetime_seconds: 300

browser:
  inactivity_timeout: 120
  use_real_profile: true

tool_loop_guardrails:
  warnings_enabled: true
  hard_stop_enabled: false
  warn_after:
    exact_failure: 2
    same_tool_failure: 3
    idempotent_no_progress: 2
  hard_stop_after:
    exact_failure: 5
    same_tool_failure: 8
    idempotent_no_progress: 5

compression:
  enabled: true
  progress_notices: false
  threshold: 0.5
  target_ratio: 0.2
  protect_last_n: 20
  min_tail_user_messages: 1
  max_attempts: 3
  proactive_prune_tokens: 0
  proactive_prune_min_result_chars: 8000
  proactive_prune_min_reclaim_tokens: 4096
  protect_first_n: 3
  codex_gpt55_autoraise: true
  codex_app_server_auto: native
  idle_compact_after_seconds: 0

prompt_caching:
  cache_ttl: 5m

display:
  skin: claude-dark                # claude-dark | claude-light | claude
  compact: false
  personality: technical
  busy_input_mode: interrupt
  bell_on_complete: false
  show_reasoning: false            # Collapsible reasoning blocks (Claude 3.7 style)
  streaming: true
  interim_assistant_messages: true
  tool_progress: all
  cleanup_progress: false
  long_running_notifications: true
  busy_ack_detail: true
  background_process_notifications: all
  message_reactions: true
  friendly_tool_labels: true       # Clean product-oriented tool badges
  turn_summary: true
  show_cost: false                 # Distraction-free clean header
  pet:
    enabled: false

desktop:
  font_family: "Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"

stt:
  enabled: true
  local:
    model: base
  openai:
    model: whisper-1

memory:
  memory_enabled: true
  user_profile_enabled: true
  memory_char_limit: 22000
  user_char_limit: 13750
  nudge_interval: 10
  flush_min_turns: 6

delegation:
  max_iterations: 50

skills:
  creation_nudge_interval: 15

command_allowlist:
  - script execution via -e/-c flag

code_execution:
  timeout: 300
  max_tool_calls: 50

session_reset:
  mode: none
  idle_minutes: 1440
  at_hour: 4

group_sessions_per_user: true

platform_toolsets:
  cli:
    - hermes-cli
  telegram:
    - hermes-telegram
  discord:
    - hermes-discord
  whatsapp:
    - hermes-whatsapp
  slack:
    - hermes-slack
  signal:
    - hermes-signal
  homeassistant:
    - hermes-homeassistant
  qqbot:
    - hermes-qqbot
  yuanbao:
    - hermes-yuanbao
  teams:
    - hermes-teams
  google_chat:
    - hermes-google_chat

approvals:
  mode: "off"

local_runtime:
  enabled: true
